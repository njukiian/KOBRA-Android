
name: Build KOBRA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip KOBRA-Android-Project.zip
          cd KOBRA-Android
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KOBRA-APK
          path: KOBRA-Android/app/build/outputs/apk/debug/app-debug.apk
          
